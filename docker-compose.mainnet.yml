# Taurion on Polygon MAINNET (spec 2026-09-13-live-wallet §9): xayax reads the real chain, tauriond
# follows it, nginx exposes /gsp and /chain. No basechain, helper or warmup -- nothing here can mint
# or impersonate. Runs beside the anvil stack under its own project name:
#   docker compose -f docker-compose.mainnet.yml -p taurion-mainnet --env-file .env.mainnet up -d
services:
  xayax:
    image: xaya/xayax
    environment:
      MAX_REORG_DEPTH: 1
    command: [
      "eth",
      "--eth_rpc_url=http://nginx/chain",
      "--eth_ws_url=${BLOCKCHAIN_WS_ENDPOINT:-http://nginx/chain}",
      "--accounts_contract=${ACCOUNTS_CONTRACT}",
      "--xayax_block_range=90",
      "--nolisten_locally",
      "--alsologtostderr",
      "--max_reorg_depth=1000"
    ]
    stop_grace_period: 1s
    restart: unless-stopped
    depends_on: [nginx]

  gsp:
    image: ${GSP_IMAGE}
    pull_policy: never
    command: [
      "tauriond",
      "--xaya_rpc_url=http://xayax:8000",
      "--xaya_rpc_protocol=2",
      "--game_rpc_port=8600",
      "--nogame_rpc_listen_locally",
      "--datadir=/xayagame",
      "--xaya_connection_check_ms=10000",
      "--xaya_zmq_staleness_ms=10000",
      "--alsologtostderr",
    ]
    volumes:
      - gspdata_mainnet:/xayagame
    stop_grace_period: 1s
    restart: unless-stopped
    depends_on:
      healthcheck_xayax:
        condition: service_healthy

  healthcheck_xayax:
    build:
      context: ./healthcheck
    stop_grace_period: 1s
    healthcheck:
      test: ["CMD", "/usr/local/bin/xayax.py"]
      interval: 1s
      timeout: 5s
      retries: 10

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.mainnet
    environment:
      BLOCKCHAIN_ENDPOINT: ${BLOCKCHAIN_ENDPOINT}
      BLOCKCHAIN_API_KEY: ${BLOCKCHAIN_API_KEY:-}
    ports:
      - "${TAURION_MAINNET_PORT:-8102}:80"
    stop_grace_period: 1s
    restart: unless-stopped

volumes:
  gspdata_mainnet:
