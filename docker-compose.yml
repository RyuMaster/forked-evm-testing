# Runs a forked blockchain, connected Xaya X and an image with a utility
# JSON-RPC server (e.g. for mining blocks on demand and sending moves
# with impersonated addresses).

services:

  basechain:
    build:
      context: ./basechain
    environment:
      ENDPOINT:  ${BLOCKCHAIN_ENDPOINT}
      FORK_BLOCK_NUMBER: ${FORK_BLOCK_NUMBER}
    volumes:
      # Persists the forked chain across restarts so a crash/redeploy resumes
      # the SAME blocks instead of re-forking fresh. Re-forking rewinds every
      # locally-mined block to new hashes, which xayax+GSP (synced past the fork
      # point) see as a reorg-beyond-pruning-depth and abort on. See
      # basechain/entrypoint.sh for the full rationale.
      - basechain_state:/state
    # Auto-recover from an upstream-RPC panic/OOM instead of staying dead for
    # hours. Safe now that state is persisted: the restarted node reloads the
    # same chain rather than diverging from xayax/GSP.
    restart: unless-stopped
    # Give anvil time to flush a final state snapshot on graceful stop/redeploy
    # (the periodic --state-interval flush already covers hard crashes).
    stop_grace_period: 30s

  xayax:
    image: xaya/xayax
    environment:
      # We don't really need reorgs at all in the test environment,
      # so can set this to something very low.
      MAX_REORG_DEPTH: 1
    command: [
      "eth",
      "--eth_rpc_url=http://nginx/chain",
      "--eth_ws_url=http://nginx/chain",
      "--accounts_contract=${ACCOUNTS_CONTRACT}",
      "--xayax_block_range=90",
      "--nolisten_locally",
      "--alsologtostderr",
      "--max_reorg_depth=1000"
    ]
    stop_grace_period: 1s
    restart: on-failure
    depends_on:
      healthcheck_chain:
        condition: service_healthy

  gsp:
    image: ${GSP_IMAGE}
    # tn-base:latest is a locally-loaded image (not in a registry); never try to pull it.
    pull_policy: never
    command: [
      "tauriond",
      "--xaya_rpc_url=http://xayax:8000",
      "--xaya_rpc_protocol=2",
      "--game_rpc_port=8600",
      "--nogame_rpc_listen_locally",
      "--datadir=/xayagame",
      "--xaya_connection_check_ms=10000",
      "--xaya_zmq_staleness_ms=10000",
      "--alsologtostderr",
    ]
    volumes:
      - gspdata:/xayagame
    stop_grace_period: 1s
    depends_on:
      healthcheck_xayax:
        condition: service_healthy

  # One-shot step that pulls the accounts / policy / WCHI / name-receiver state
  # into anvil's forked-state cache before anything asks for it in anger.
  #
  # A fresh stack has an empty cache, and the upstream RPC pool answers a
  # sizeable fraction of COLD account fetches with a JSON-RPC error rather than
  # an empty account -- which anvil, correctly, treats as an authoritative
  # answer rather than something to retry. The first thing to touch such an
  # address is then what fails, and that used to be a player pressing "Create".
  # See helper/warmup.py for the measurements and for why raising anvil's
  # --retries is not the fix.
  #
  # Shares the helper image because it needs exactly what the helper needs (web3
  # plus the contract ABIs). Read-only, so re-running it is always safe:
  #   docker compose run --rm warmup
  warmup:
    build:
      context: ./helper
    entrypoint: ["python3", "/usr/local/bin/warmup.py"]
    environment:
      ACCOUNTS_CONTRACT: ${ACCOUNTS_CONTRACT}
      WARMUP_BUDGET_SECONDS: ${WARMUP_BUDGET_SECONDS:-180}
      WARMUP_EXTRA_ADDRESSES: ${WARMUP_EXTRA_ADDRESSES:-0x1234567890123456789012345678901234567890}
    # A step, not a service: it must run once to completion, never be restarted.
    restart: "no"
    stop_grace_period: 1s
    depends_on:
      healthcheck_chain:
        condition: service_healthy

  helper:
    build:
      context: ./helper
    environment:
      ACCOUNTS_CONTRACT: ${ACCOUNTS_CONTRACT}
    stop_grace_period: 1s
    # This was the only long-running service in the stack without one, and the
    # omission is what turned a transient boot race into an outage: the server
    # resolves wchiToken() at import, so anything that upsets that one call
    # kills the process, and compose's default `no` then left the entire write
    # path -- registration, moves, admin -- dead until a human noticed and ran
    # `docker start`.  The warm-up below is what PREVENTS the race; this is the
    # net under it, because a restart re-runs exactly the resolution that
    # failed and the next attempt is seconds later.
    restart: unless-stopped
    depends_on:
      # Deliberately the warm-up rather than healthcheck_chain. That healthcheck
      # only proves anvil answers eth_chainId, which it does from memory as soon
      # as it binds -- before the fork can serve state. This server resolves
      # wchiToken() at import time and has died in exactly that gap. Waiting for
      # the warm-up to COMPLETE closes the window, and warms the registration
      # path on the way through.
      warmup:
        condition: service_completed_successfully

  nginx:
    build:
      context: ./nginx
    ports:
      # Host port is configurable so this stack can run alongside the Soccerverse
      # stack (which already publishes 8100). Defaults to 8101.
      - "${TAURION_NGINX_PORT:-8101}:80"
    stop_grace_period: 1s

  healthcheck_chain:
    build:
      context: ./healthcheck
    stop_grace_period: 1s
    healthcheck:
      test: ["CMD", "/usr/local/bin/basechain.py"]
      interval: 1s
      timeout: 5s
      retries: 10

  healthcheck_xayax:
    build:
      context: ./healthcheck
    stop_grace_period: 1s
    healthcheck:
      test: ["CMD", "/usr/local/bin/xayax.py"]
      interval: 1s
      timeout: 5s
      retries: 10

volumes:
  # Persists the Taurion GSP (tauriond) SQLite state across restarts/redeploys.
  gspdata:
  # Anvil's forked-chain state snapshot. Survives `docker compose down` and
  # redeploys; wipe it (`docker volume rm <stack>_basechain_state`) to start
  # from a clean fork or after changing FORK_BLOCK_NUMBER.
  basechain_state:
