# Taurion PRODUCTION: the game server following real Polygon mainnet.
#
# Runs as its own stack beside the anvil test stack (branch taurion_master). Only what is bound to
# the real chain is started here:
#
#   xayax  - reads Polygon through this stack's nginx; the anvil stack's xayax cannot be reused,
#            it indexes the fork.
#   gsp    - tauriond, the SAME locally-loaded tn-base image the anvil stack runs (not rebuilt, not
#            pulled), with its own state volume.
#   nginx  - /gsp and /chain on port 8102 (the app's built-in PRODUCTION profile). /chain goes to the
#            real node, not anvil, so the anvil stack's nginx cannot serve it.
#
# Not started here: basechain, helper, warmup, healthcheck containers. Nothing on mainnet mints,
# impersonates or funds -- the phone's own wallet signs every transaction and pays for it.
#
# Every setting has a working default, so the stack deploys with no env file at all. Override any of
# them in the Portainer stack env (or a .env file, see .env.example).
#
#   docker compose up -d      # project name comes from `name:` below

name: taurion-production

services:

  xayax:
    image: xaya/xayax
    environment:
      # A real chain reorgs. The entrypoint passes this as --max_reorg_depth.
      MAX_REORG_DEPTH: 1000
    command: [
      "eth",
      "--eth_rpc_url=http://nginx/chain",
      "--eth_ws_url=${BLOCKCHAIN_WS_ENDPOINT:-http://nginx/chain}",
      "--accounts_contract=${ACCOUNTS_CONTRACT:-0x8C12253F71091b9582908C8a44F78870Ec6F304F}",
      "--xayax_block_range=90",
      "--nolisten_locally",
      "--alsologtostderr"
    ]
    volumes:
      # Its block cache survives a recreate, so a redeploy does not refetch the reorg window.
      - xayaxdata:/xayax
    # No separate healthcheck container: the image has bash, and an open JSON-RPC port is what the
    # GSP needs before it starts.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    stop_grace_period: 5s
    restart: unless-stopped
    depends_on: [nginx]

  gsp:
    image: ${GSP_IMAGE:-tn-base:latest}
    # tn-base:latest is a locally-loaded image (not in a registry); never try to pull it.
    pull_policy: never
    command: [
      "tauriond",
      "--xaya_rpc_url=http://xayax:8000",
      "--xaya_rpc_protocol=2",
      "--game_rpc_port=8600",
      "--nogame_rpc_listen_locally",
      "--datadir=/xayagame",
      "--xaya_connection_check_ms=10000",
      # 30 s, not the 10 s default: the first start syncs every block since the game's Polygon
      # genesis (93,300,000), and 10 s of ZMQ silence during that catch-up kills tauriond
      # (mainloop.cpp:26 Check failed: !IsRunning()).
      "--xaya_zmq_staleness_ms=30000",
      "--alsologtostderr",
    ]
    volumes:
      - gspdata:/xayagame
    stop_grace_period: 10s
    restart: unless-stopped
    depends_on:
      xayax:
        condition: service_healthy

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.mainnet
    environment:
      # Polygon mainnet JSON-RPC. A full node is enough (xayax reads blocks and logs; the phone
      # reads balances, fees and receipts at the tip). Both defaults answered keyless on 2026-09-16;
      # https://polygon.drpc.org is the fallback.
      BLOCKCHAIN_ENDPOINT: ${BLOCKCHAIN_ENDPOINT:-https://polygon-node.xaya.io}
      # Optional X-goog-api-key for the node. Added by nginx only; xayax and the phone never see it.
      BLOCKCHAIN_API_KEY: ${BLOCKCHAIN_API_KEY:-}
      # The Play test's app key (native spec 2026-10-01 §3.2); stack.env, never committed.
      TAURION_APP_KEY: ${TAURION_APP_KEY:?TAURION_APP_KEY must be set in stack.env}
    ports:
      - "${TAURION_PRODUCTION_PORT:-8102}:80"
    stop_grace_period: 1s
    restart: unless-stopped

  # Read-scaling fanout (native spec 2026-10-01 §3.3), the anvil stack's service: taurionui fanout/
  # e8f45c6, unmodified. ONE reader on the GSP, pushed to every client over SSE; its per-block Move-log
  # lookup reads OUR node through nginx (in-stack, so the tunnel gate does not apply). The image is
  # built on the laptop by the anvil branch's fanout/build-image.sh.
  fanout:
    image: tn-fanout:e8f45c6
    pull_policy: never
    command: ["node", "fanout/server.mjs"]
    environment:
      GSP_RPC: http://gsp:8600
      POLYGON_RPC: http://nginx/chain
      FEED_PORT: "8090"
      FEED_ORIGIN: "*"
    restart: on-failure:10
    depends_on:
      - gsp

volumes:
  # tauriond's SQLite state. Wiping it means re-syncing from the Polygon genesis block.
  gspdata:
  xayaxdata:
