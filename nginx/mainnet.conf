js_path "/etc/nginx/njs/";
js_import rpc from rpc_allow.js;

# TUNNEL GATE (native spec 2026-10-01-play-internal-test §3.2), as on the anvil stack's proxy.conf.template.
# Cloudflare adds CF-Connecting-IP to every request that comes through the tunnel; LAN callers and the
# stack's own services (xayax reads /chain, the fanout /chain and /gsp) never carry it and keep today's
# behaviour exactly. 04-require-key.sh refuses to start with an empty or short key, so the "1|" entry
# can never match a request without a key.
# The key entry ("1|" + 64 hex chars) is longer than the default 64-byte map bucket.
map_hash_bucket_size 128;
map $http_cf_connecting_ip $via_tunnel { "" 0; default 1; }
map "$via_tunnel|$http_x_taurion_key" $tunnel_denied {
  default 1;
  "~^0\|" 0;
  "1|${TAURION_APP_KEY}" 0;
}
# The fanout caps streams per client IP; behind the tunnel every tester arrives from the connector.
map $http_cf_connecting_ip $client_ip { "" $remote_addr; default $http_cf_connecting_ip; }

server {
  listen 80 default_server;
  resolver 127.0.0.11 valid=1s;

  if ($tunnel_denied) { return 403; }

  # The phone's LIVE profile reads <base>/chain (spec 2 §1); the node's key stays here.
  location = /chain {
    if ($via_tunnel) { rewrite ^ /_tunnel/chain last; }
    proxy_pass ${BLOCKCHAIN_ORIGIN}${BLOCKCHAIN_PATH};
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Host ${BLOCKCHAIN_HOST};
    proxy_set_header Content-Type application/json;
    proxy_set_header X-goog-api-key "${BLOCKCHAIN_API_KEY}";
    # xayax's --eth_ws_url is this same path: pass a WebSocket upgrade through to the node, the way
    # the Soccerverse mainnet stack's /chain does.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
  location /gsp {
    if ($via_tunnel) { rewrite ^ /_tunnel/gsp last; }
    set $upstream http://gsp:8600/;
    proxy_pass $upstream;
    proxy_set_header Content-Type application/json;
  }
  # no /helper: nothing on mainnet mints or impersonates.

  # The read-scaling fanout (native spec 2026-10-01 §3.3), as on the anvil stack.
  location /feed/ {
    set $upstream http://fanout:8090;

    rewrite ^/feed/(.*)$ /$1 break;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Tunnel traffic for the JSON-RPC routes: rpc_allow.js checks every method, then forwards to /_up/*.
  location = /_tunnel/chain { internal; include /etc/nginx/rpc_body.conf; js_content rpc.chainLive; }
  location = /_tunnel/gsp   { internal; include /etc/nginx/rpc_body.conf; js_content rpc.gsp; }

  location = /_up/chain {
    internal;
    # Only the headers set below reach the node. The tester's own (CF-Connecting-IP, CF-Ray, CDN-Loop,
    # X-Taurion-Key, ...) must not: the node is itself behind Cloudflare, which answers a request still
    # carrying Cloudflare's headers with 403 "error code: 1000" (measured 2026-10-01).
    proxy_pass_request_headers off;
    proxy_pass ${BLOCKCHAIN_ORIGIN}${BLOCKCHAIN_PATH};
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Host ${BLOCKCHAIN_HOST};
    proxy_set_header Content-Type application/json;
    proxy_set_header X-goog-api-key "${BLOCKCHAIN_API_KEY}";
  }
  location = /_up/gsp {
    internal;
    set $upstream http://gsp:8600/;
    proxy_pass $upstream;
    proxy_set_header Content-Type application/json;
  }
}
