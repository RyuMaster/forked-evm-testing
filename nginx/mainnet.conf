server {
  listen 80 default_server;
  resolver 127.0.0.11 valid=1s;

  # The phone's LIVE profile reads <base>/chain (spec 2 §1); the node's key stays here.
  location = /chain {
    proxy_pass ${BLOCKCHAIN_ORIGIN}${BLOCKCHAIN_PATH};
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Host ${BLOCKCHAIN_HOST};
    proxy_set_header Content-Type application/json;
    proxy_set_header X-goog-api-key "${BLOCKCHAIN_API_KEY}";
    proxy_set_header Connection "";
  }
  location /gsp {
    set $upstream http://gsp:8600/;
    proxy_pass $upstream;
    proxy_set_header Content-Type application/json;
  }
  # no /helper: nothing on mainnet mints or impersonates.
}
