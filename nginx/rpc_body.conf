# Included by every tunnel-gated JSON-RPC location (proxy.conf.template / mainnet.conf). rpc_allow.js
# reads the request body as r.requestText, so it must sit in ONE memory buffer; the upstream answer comes
# back as an in-memory subrequest and must fit its buffer (largest answer measured 2026-10-01:
# getbuildings, 330 KB on both stacks).
client_max_body_size 256k;
client_body_buffer_size 256k;
client_body_in_single_buffer on;
subrequest_output_buffer_size 8m;
