# Included by every tunnel-gated JSON-RPC location (proxy.conf.template / mainnet.conf). rpc_allow.js
# reads the request body as r.requestText, so it must sit in ONE memory buffer. (The answer's buffer,
# subrequest_output_buffer_size, is read from the SUBREQUEST's location -- /_up/* -- so it is set at
# server level in the conf, not here.)
client_max_body_size 256k;
client_body_buffer_size 256k;
client_body_in_single_buffer on;
