# Map host (native spec 2026-09-13-map-delivery §3.2): the manifest is never cached, tiles for a
# day. KTX2 is not in nginx's mime table, so it would go out as text/plain otherwise.
server {
  listen 80 default_server;
  root /usr/share/nginx/html;
  types { application/json json; application/octet-stream ktx2; }
  gzip on;
  gzip_types application/json;

  location = /map/manifest.json {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location /map/ {
    add_header Cache-Control "max-age=86400";
    try_files $uri =404;
  }
  location / { return 404; }
}
